name: Deploy Status Page

on:
  push:
    branches: [main, master]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    name: Deploy ke GitHub Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static page
        run: |
          mkdir -p _site
          cp web/gate.html _site/index.html
          cp web/gate.css _site/
          cp web/gate.js _site/
          # Ubah URL API agar mengarah ke VPS Anda
          sed -i 's|/api/|https://your-vps-domain.com/api/|g' _site/gate.js 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
