name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Static Page
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare page
        run: |
          mkdir -p _site
          
          # Copy gate page assets
          cp web/gate.html _site/index.html
          cp web/gate.css _site/ 2>/dev/null || true
          cp web/gate.js _site/ 2>/dev/null || true
          
          # List what we have
          echo "Files in _site:"
          ls -la _site/

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
