name: Deploy to VPS

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy ke VPS
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check secrets
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "⚠️ Secret VPS_HOST belum di-set. Skip deploy."
            echo "Cara set: Repository → Settings → Secrets → New repository secret"
            exit 0
          fi
          echo "✅ VPS_HOST tersedia"

      - name: Deploy via SSH
        if: secrets.VPS_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "=== DEPLOY SENTINEL ARENA ==="
            cd /opt/sentinel-arena
            cp data/state.json data/state.json.backup.$(date +%Y%m%d_%H%M%S) 2>/dev/null || true
            git fetch origin
            git reset --hard origin/main || git reset --hard origin/master
            systemctl restart sentinel-arena 2>/dev/null || true
            echo "=== DEPLOY SELESAI ==="
