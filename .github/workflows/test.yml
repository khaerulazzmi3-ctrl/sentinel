name: Test & Validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Check Python syntax
        run: |
          echo "=== Checking Python syntax ==="
          python -c "
          import py_compile
          import glob
          files = []
          for pattern in ['core/*.py', 'security/*.py', 'server/*.py', 'trading/*.py']:
              files.extend(glob.glob(pattern))
          for f in files:
              try:
                  py_compile.compile(f, doraise=True)
              except py_compile.PyCompileError as e:
                  print(f'❌ {f}: {e}')
                  raise
          print(f'✅ {len(files)} Python files compiled successfully')
          "

      - name: Lint with flake8
        run: |
          echo "=== Running flake8 ==="
          flake8 core/ security/ server/ trading/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
          echo "✅ Lint check complete"

      - name: Validate config.json
        run: |
          echo "=== Validating config.json ==="
          python -c "import json; json.load(open('config.json')); print('✅ config.json valid')"

      - name: Test imports (without MetaTrader5)
        run: |
          echo "=== Testing imports ==="
          python -c "from core.config import cfg; print('✅ core.config OK')"
          python -c "from core.store import STORE; print('✅ core.store OK')"
          python -c "from security.agent import SecurityAgent, TIERS; print('✅ security.agent OK')"
          python -c "from trading.datafeed import MarketData; print('✅ trading.datafeed OK')"
          python -c "from trading.strategies import STRATEGY_CLASSES; print('✅ trading.strategies OK')"
          python -c "from trading.backtest import Result; print('✅ trading.backtest OK')"

  web-validate:
    name: Web Dashboard Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JS syntax
        run: |
          echo "=== Checking JavaScript syntax ==="
          node --check web/app.js
          node --check web/gate.js
          echo "✅ JavaScript syntax OK"

      - name: Check HTML structure
        run: |
          echo "=== Checking HTML files ==="
          python -c "
          from html.parser import HTMLParser
          import glob
          for f in glob.glob('web/*.html'):
              with open(f) as fh:
                  content = fh.read()
                  parser = HTMLParser()
                  parser.feed(content)
              print(f'  ✅ {f}')
          print('HTML files OK')
          "

  workflow-validate:
    name: Validate Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate YAML syntax
        run: |
          echo "=== Validating YAML syntax ==="
          python -c "
          import yaml
          import glob
          for f in glob.glob('.github/workflows/*.yml'):
              yaml.safe_load(open(f))
              print(f'  ✅ {f}')
          print('All YAML files valid')
          "
