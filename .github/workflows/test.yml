name: Test & Validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 py_compile

      - name: Check Python syntax
        run: |
          echo "=== Checking Python syntax ==="
          python -m py_compile core/*.py
          python -m py_compile security/*.py
          python -m py_compile server/*.py
          python -m py_compile trading/*.py
          echo "✅ All Python files compile successfully"

      - name: Lint with flake8
        run: |
          echo "=== Running flake8 ==="
          flake8 core/ security/ server/ trading/ --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Validate config.json
        run: |
          echo "=== Validating config.json ==="
          python -c "import json; json.load(open('config.json')); print('✅ config.json valid')"

      - name: Test imports (without MetaTrader5)
        run: |
          echo "=== Testing imports ==="
          python -c "from core.config import cfg; print('✅ core.config OK')"
          python -c "from core.store import STORE; print('✅ core.store OK')"
          python -c "from security.agent import SecurityAgent, TIERS; print('✅ security.agent OK')"
          python -c "from trading.datafeed import MarketData; print('✅ trading.datafeed OK')"
          python -c "from trading.strategies import STRATEGY_CLASSES; print('✅ trading.strategies OK')"
          python -c "from trading.backtest import Result; print('✅ trading.backtest OK')"

  web-validate:
    name: Web Dashboard Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate HTML
        run: |
          echo "=== Checking HTML files ==="
          npm install -g htmlhint
          htmlhint web/*.html || true
          echo "✅ HTML check complete"

      - name: Check JS syntax
        run: |
          echo "=== Checking JavaScript syntax ==="
          node --check web/app.js
          node --check web/gate.js
          echo "✅ JavaScript syntax OK"

      - name: Check CSS
        run: |
          echo "=== Checking CSS files ==="
          npm install -g stylelint
          stylelint web/*.css || true
          echo "✅ CSS check complete"

  workflow-validate:
    name: Validate Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint workflow files
        run: |
          echo "=== Linting workflow files ==="
          yamllint -d relaxed .github/workflows/*.yml
          echo "✅ Workflow files OK"

      - name: Validate YAML syntax
        run: |
          echo "=== Validating YAML syntax ==="
          python -c "
          import yaml
          import glob
          for f in glob.glob('.github/workflows/*.yml'):
              yaml.safe_load(open(f))
              print(f'  ✅ {f}')
          print('All YAML files valid')
          "
