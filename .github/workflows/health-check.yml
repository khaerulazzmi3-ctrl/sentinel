name: Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    name: Cek kesehatan agent
    steps:
      - name: Check secrets
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "⚠️ Secret VPS_HOST belum di-set. Skip health check."
            exit 0
          fi
          echo "✅ VPS_HOST tersedia"

      - name: Check /api/health
        if: secrets.VPS_HOST != ''
        id: health
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.AGENT_PORT || 8787 }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://${HOST}:${PORT}/api/health" || echo "000")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          if [ "$STATUS" != "200" ]; then
            echo "❌ AGENT TIDAK RESPON (status $STATUS)"
            exit 1
          fi
          echo "✅ Agent OK"

      - name: Notify Discord
        if: failure() && secrets.DISCORD_WEBHOOK != ''
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{"content": "⚠️ SENTINEL ARENA DOWN! Status: ${{ steps.health.outputs.status }}"}' 2>/dev/null || true
