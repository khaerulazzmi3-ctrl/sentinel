name: Health Check

on:
  schedule:
    - cron: '*/5 * * * *'   # Tiap 5 menit
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    name: Cek kesehatan agent
    steps:
      - name: Check /api/health
        id: health
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.AGENT_PORT || 8787 }}"
          
          # Cek HTTP response
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            "http://${HOST}:${PORT}/api/health" || echo "000")
          
          echo "HTTP Status: $STATUS"
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          
          if [ "$STATUS" != "200" ]; then
            echo "❌ AGENT TIDAK RESPON (status $STATUS)"
            exit 1
          fi
          
          # Cek mode di response
          MODE=$(curl -s --max-time 10 "http://${HOST}:${PORT}/api/health" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('mode','?'))" 2>/dev/null || echo "?")
          echo "Mode: $MODE"
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          
          echo "✅ Agent OK — mode: $MODE"

      - name: Notify Discord — Success
        if: success()
        run: |
          # Kirim status OK hanya kalau sebelumnya fail (opsional)
          # Atau matikan step ini kalau tidak perlu notif tiap 5 menit
          echo "Agent healthy — no alert needed"

      - name: Notify Discord — Agent Down
        if: failure()
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "⚠️ SENTINEL ARENA DOWN",
                "description": "Health check gagal. Status HTTP: ${{ steps.health.outputs.status }}",
                "color": 16711680,
                "fields": [
                  {"name": "Host", "value": "${{ secrets.VPS_HOST }}:${{ secrets.AGENT_PORT || 8787 }}", "inline": true},
                  {"name": "Waktu", "value": "'"$(date -u +"%Y-%m-%d %H:%M UTC")"'", "inline": true}
                ],
                "footer": {"text": "GitHub Actions Health Check"}
              }]
            }' 2>/dev/null || echo "Discord webhook gagal"

      - name: Notify Telegram — Agent Down
        if: failure() && secrets.TELEGRAM_BOT_TOKEN != ''
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=⚠️ SENTINEL ARENA DOWN%0AStatus: ${{ steps.health.outputs.status }}%0AHost: ${{ secrets.VPS_HOST }}%0AWaktu: $(date -u +"%Y-%m-%d %H:%M UTC")" \
            2>/dev/null || echo "Telegram gagal"
